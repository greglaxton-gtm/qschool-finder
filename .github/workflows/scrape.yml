name: Update leaderboards

# Manual only: GitHub's cloud IPs are challenged by bluegolf's WAF, so the
# scheduled scrape runs from a home machine (see scripts/). Kept for testing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci --prefix scraper
      - run: cd scraper && npx playwright install --with-deps chromium
      - run: node scraper/scrape.mjs
      - name: Commit data.json if it changed
        run: |
          git config user.name "qschool-bot"
          git config user.email "qschool-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
